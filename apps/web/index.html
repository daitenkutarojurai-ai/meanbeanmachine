    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bean Machine" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bean Machine" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Bean Machine",
        "url": "https://bean-machine.important-leech.workers.dev/",
        "image": "https://bean-machine.important-leech.workers.dev/og.png",
        "description": "A free falling-bean puzzle battler: chain combos, 13 arenas with bosses, and online battles.",
        "genre": ["Puzzle", "Casual"],
        "gamePlatform": ["Web browser", "Android", "iOS"],
        "applicationCategory": "Game",
        "playMode": ["SinglePlayer", "MultiPlayer"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='14' height='13' rx='6' fill='%233fc95a'/%3E%3Ccircle cx='5.5' cy='7' r='2' fill='white'/%3E%3Ccircle cx='10.5' cy='7' r='2' fill='white'/%3E%3Ccircle cx='6' cy='7.5' r='1' fill='black'/%3E%3Ccircle cx='11' cy='7.5' r='1' fill='black'/%3E%3C/svg%3E" />
    <title>Bean Machine: free bean-popping puzzle battles</title>
  </head>
  <body>
    <div id="app">
      <div id="game" hidden>
        <canvas id="screen"></canvas>
        <div id="hud"></div>
      </div>
      <div id="ui"></div>
      <div id="touch" hidden>
        <div class="pad">
          <button data-key="left" aria-label="Move left">◀</button>
          <button data-key="down" aria-label="Drop">▼</button>
          <button data-key="right" aria-label="Move right">▶</button>
        </div>
        <div class="pad">
          <button data-key="ccw" aria-label="Rotate left">↺</button>
          <button data-key="cw" aria-label="Rotate right">↻</button>
        </div>
      </div>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
